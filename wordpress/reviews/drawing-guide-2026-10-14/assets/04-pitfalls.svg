<svg xmlns="http://www.w3.org/2000/svg" width="800" height="820" viewBox="0 0 800 820" role="img">
<title>描き方で迷いやすい4つの点と見直し</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#58868a"/></marker></defs>
<rect width="800" height="820" rx="16" fill="#f2f8f7"/>
<g font-family="system-ui, sans-serif"><rect x="24" y="24" width="752" height="178" rx="12" fill="white" stroke="#c4d9d7"/><text x="48" y="59" text-anchor="start" font-size="25" fill="#183c42">1. 行動を状態にしている</text><text x="205" y="110" text-anchor="middle" font-size="23" fill="#875351">購入する</text><text x="383" y="110" text-anchor="middle" font-size="25" fill="#183c42">→</text><text x="570" y="110" text-anchor="middle" font-size="23" fill="#183c42">意外と良い</text><text x="400" y="166" text-anchor="middle" font-size="23" fill="#183c42">体験の前後で、どんな気持ちに変わる？</text><rect x="24" y="222" width="752" height="178" rx="12" fill="white" stroke="#c4d9d7"/><text x="48" y="257" text-anchor="start" font-size="25" fill="#183c42">2. 2軸の意味が似ている</text><text x="205" y="308" text-anchor="middle" font-size="23" fill="#875351">認知度 × 理解度</text><text x="383" y="308" text-anchor="middle" font-size="25" fill="#183c42">→</text><text x="570" y="308" text-anchor="middle" font-size="23" fill="#183c42">知識 × 健康への意識</text><text x="400" y="364" text-anchor="middle" font-size="23" fill="#183c42">このゴールには、異なる何が必要？</text><rect x="24" y="420" width="752" height="178" rx="12" fill="white" stroke="#c4d9d7"/><text x="48" y="455" text-anchor="start" font-size="25" fill="#183c42">3. 斜め一直線に並ぶ</text><text x="205" y="506" text-anchor="middle" font-size="23" fill="#875351">○ → ○ → ○</text><text x="383" y="506" text-anchor="middle" font-size="25" fill="#183c42">→</text><text x="570" y="506" text-anchor="middle" font-size="23" fill="#183c42">2軸の違いを見直す</text><text x="400" y="562" text-anchor="middle" font-size="23" fill="#183c42">一方だけが深まる状態を省略していない？</text><rect x="24" y="618" width="752" height="178" rx="12" fill="white" stroke="#c4d9d7"/><text x="48" y="653" text-anchor="start" font-size="25" fill="#183c42">4. 施策が状態の箱に入る</text><text x="205" y="704" text-anchor="middle" font-size="23" fill="#875351">［お試しキット］</text><text x="383" y="704" text-anchor="middle" font-size="25" fill="#183c42">→</text><text x="570" y="704" text-anchor="middle" font-size="23" fill="#183c42">状態 → お試し → 状態</text><text x="400" y="760" text-anchor="middle" font-size="23" fill="#183c42">施策は、変化を支える矢印へ対応づける</text></g></svg>