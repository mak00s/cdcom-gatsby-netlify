<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img">
<title>ヘアケア事業の途中図1</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#58868a"/></marker></defs>
<rect width="800" height="650" rx="16" fill="#f2f8f7"/>
<g font-family="system-ui, sans-serif"><path d="M80 80 H755" fill="none" stroke="#58868a" stroke-width="3" marker-end="url(#arrow)"/><path d="M80 80 V610" fill="none" stroke="#58868a" stroke-width="3" marker-end="url(#arrow)"/><text x="420" y="42" text-anchor="middle" font-size="24" fill="#183c42">自分ケアの知識 → 深まる</text><text x="30" y="350" text-anchor="middle" transform="rotate(-90 30 350)" font-size="24" fill="#183c42">健康への意識 → 深まる</text><rect x="105.0" y="88" width="160" height="64" rx="12" fill="#fff0c4" stroke="#43777c" stroke-width="2"/><text x="185" y="128" text-anchor="middle" font-size="22" fill="#183c42">何でもいい</text><rect x="570.0" y="548" width="180" height="64" rx="12" fill="#ffe4e5" stroke="#43777c" stroke-width="2"/><text x="660" y="577" text-anchor="middle" font-size="22" fill="#183c42">身も心も</text><text x="660" y="603" text-anchor="middle" font-size="22" fill="#183c42">充実の毎日</text><text x="395" y="290" text-anchor="middle" font-size="23" fill="#183c42">理解だけでも、意識だけでも足りない</text><text x="395" y="328" text-anchor="middle" font-size="23" fill="#183c42">この人のゴールに必要な2つの変化は？</text><text x="430" y="465" text-anchor="middle" font-size="21" fill="#546f72">状態と施策は、次の手順で加える</text></g></svg>