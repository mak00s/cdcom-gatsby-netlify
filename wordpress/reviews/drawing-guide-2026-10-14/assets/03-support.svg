<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" role="img">
<title>ヘアケア事業の途中図3</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#58868a"/></marker></defs>
<rect width="800" height="650" rx="16" fill="#f2f8f7"/>
<g font-family="system-ui, sans-serif"><path d="M80 80 H755" fill="none" stroke="#58868a" stroke-width="3" marker-end="url(#arrow)"/><path d="M80 80 V610" fill="none" stroke="#58868a" stroke-width="3" marker-end="url(#arrow)"/><text x="420" y="42" text-anchor="middle" font-size="24" fill="#183c42">自分ケアの知識 → 深まる</text><text x="30" y="350" text-anchor="middle" transform="rotate(-90 30 350)" font-size="24" fill="#183c42">健康への意識 → 深まる</text><rect x="105.0" y="88" width="160" height="64" rx="12" fill="#fff0c4" stroke="#43777c" stroke-width="2"/><text x="185" y="128" text-anchor="middle" font-size="22" fill="#183c42">何でもいい</text><rect x="570.0" y="548" width="180" height="64" rx="12" fill="#ffe4e5" stroke="#43777c" stroke-width="2"/><text x="660" y="577" text-anchor="middle" font-size="22" fill="#183c42">身も心も</text><text x="660" y="603" text-anchor="middle" font-size="22" fill="#183c42">充実の毎日</text><path d="M185 152 L240 196" fill="none" stroke="#58868a" stroke-width="3" marker-end="url(#arrow)"/><text x="190" y="182" text-anchor="middle" font-size="22" fill="#a33b43">A</text><path d="M250 252 V307" fill="none" stroke="#58868a" stroke-width="3" marker-end="url(#arrow)"/><text x="280" y="285" text-anchor="middle" font-size="22" fill="#a33b43">B</text><path d="M340 339 H400" fill="none" stroke="#58868a" stroke-width="3" marker-end="url(#arrow)"/><text x="369" y="319" text-anchor="middle" font-size="22" fill="#a33b43">C</text><path d="M455 371 V426" fill="none" stroke="#58868a" stroke-width="3" marker-end="url(#arrow)"/><text x="485" y="401" text-anchor="middle" font-size="22" fill="#a33b43">D</text><path d="M660 371 V426" fill="none" stroke="#58868a" stroke-width="3" marker-end="url(#arrow)"/><text x="690" y="401" text-anchor="middle" font-size="22" fill="#a33b43">E</text><path d="M545 458 H570" fill="none" stroke="#58868a" stroke-width="3" marker-end="url(#arrow)"/><text x="558" y="439" text-anchor="middle" font-size="22" fill="#a33b43">F</text><path d="M660 490 V544" fill="none" stroke="#58868a" stroke-width="3" marker-end="url(#arrow)"/><text x="690" y="523" text-anchor="middle" font-size="22" fill="#a33b43">G</text><rect x="160.0" y="188" width="180" height="64" rx="12" fill="#ffffff" stroke="#43777c" stroke-width="2"/><text x="250" y="228" text-anchor="middle" font-size="22" fill="#183c42">問題かも</text><rect x="160.0" y="307" width="180" height="64" rx="12" fill="#ffffff" stroke="#43777c" stroke-width="2"/><text x="250" y="347" text-anchor="middle" font-size="22" fill="#183c42">意外と良い</text><rect x="400.0" y="307" width="340" height="64" rx="12" fill="#ffffff" stroke="#43777c" stroke-width="2"/><text x="570" y="347" text-anchor="middle" font-size="22" fill="#183c42">しっかり納得</text><rect x="365.0" y="426" width="180" height="64" rx="12" fill="#ffffff" stroke="#43777c" stroke-width="2"/><text x="455" y="466" text-anchor="middle" font-size="22" fill="#183c42">他もケアしたい</text><rect x="570.0" y="426" width="180" height="64" rx="12" fill="#ffffff" stroke="#43777c" stroke-width="2"/><text x="660" y="455" text-anchor="middle" font-size="22" fill="#183c42">ずっとキープ</text><text x="660" y="481" text-anchor="middle" font-size="22" fill="#183c42">したい</text><text x="430" y="635" text-anchor="middle" font-size="20" fill="#546f72">中間状態5個。スタートとゴールは含めない。</text></g></svg>