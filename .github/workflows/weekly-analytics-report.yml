name: Weekly analytics report

on:
  workflow_dispatch:
  schedule:
    # Monday 09:15 JST (00:15 UTC). Uses the latest fully completed Mon-Sun week.
    - cron: "15 0 * * 1"

permissions:
  contents: read

concurrency:
  group: weekly-analytics-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - name: Install dependencies
        run: pip install -r analytics/requirements.txt
      - name: Collect and validate AI crawler requests
        env:
          SAKURA_CRAWLER_SSH_PRIVATE_KEY: ${{ secrets.SAKURA_CRAWLER_SSH_PRIVATE_KEY }}
          SAKURA_CRAWLER_SSH_KNOWN_HOSTS: ${{ secrets.SAKURA_CRAWLER_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SAKURA_CRAWLER_SSH_PRIVATE_KEY" > ~/.ssh/concept_crawler
          chmod 600 ~/.ssh/concept_crawler
          printf '%s\n' "$SAKURA_CRAWLER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -T -i ~/.ssh/concept_crawler -o IdentitiesOnly=yes \
            mak-s@www3780.sakura.ne.jp \
            | python analytics/ai_crawler_report.py --output analytics/ai_crawler_snapshot.json
      - name: Refresh Google Sheets report
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GA4_PROPERTY_ID: "386697973"
          GSC_SITE_URL: "sc-domain:concept-diagram.com"
          SITE_HOST: "concept-diagram.com"
          BACKFILL_WEEKS: "52"
          AI_CRAWLER_JSON: "analytics/ai_crawler_snapshot.json"
        run: python analytics/weekly_report.py
